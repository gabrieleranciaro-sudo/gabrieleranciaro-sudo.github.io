<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Pagamenti"><link rel="manifest" href="./manifest.json"><title>Pagamenti Familiari</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}:root{--bg:#07101d;--panel:#101a2b;--panel2:#162236;--border:#26364d;--text:#f4f7fb;--muted:#94a3b8;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#eab308}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.container{max-width:1050px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card,.modal{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px}.login-card{width:100%;max-width:410px}small,label{color:var(--muted)}label{display:block;font-size:13px;margin:15px 0 7px}input,select,textarea{width:100%;background:#0b1422;color:white;border:1px solid var(--border);border-radius:12px;padding:13px}textarea{min-height:80px}.primary,.secondary,.danger{border-radius:10px;padding:11px 14px;color:white}.primary{width:100%;margin-top:20px;border:0;background:var(--blue);font-weight:700}.secondary{border:1px solid var(--border);background:var(--panel2)}.danger{border:0;background:var(--red)}button:disabled{opacity:.55;cursor:default}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}header h1{font-size:26px;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}.stat{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:16px}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.stat strong{font-size:22px}.calendar-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;overflow:hidden}.calendar-header{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid var(--border)}.calendar-header h2{margin:0;text-transform:capitalize;font-size:20px}.nav-buttons{display:flex;gap:7px}.nav-buttons button{border:1px solid var(--border);background:var(--panel2);color:white;width:38px;height:38px;border-radius:9px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{padding:11px 4px;text-align:center;color:var(--muted);font-size:11px;border-bottom:1px solid var(--border)}.day{min-height:90px;border:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:7px;overflow:hidden;background:transparent;color:inherit;text-align:left;width:100%;border-radius:0}.day:nth-child(7n){border-right:0}.day:not(.empty):hover,.day:not(.empty):focus-visible{background:var(--panel2)}.day.empty{opacity:.3}.day-number{font-size:12px;color:var(--muted);margin-bottom:8px}.today .day-number{display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:50%;background:var(--blue);color:white}.dots{display:flex;flex-wrap:wrap;gap:5px}.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--red)}.dot.overdue{background:#991b1b}.dot.paid{background:var(--green)}.dot.paid_late{background:var(--yellow)}.fab{position:fixed;right:24px;bottom:25px;width:62px;height:62px;border:0;border-radius:50%;background:var(--blue);color:white;font-size:35px;z-index:20}.modal-bg{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.modal{width:100%;max-width:510px;max-height:90vh;overflow-y:auto}.modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-top h2{margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:28px}.detail-row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--border);padding:12px 0}.detail-row span{color:var(--muted)}.status{display:inline-block;margin-top:12px;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:bold;background:var(--red)}.status.overdue{background:#991b1b}.status.paid{background:var(--green)}.status.paid_late{background:var(--yellow);color:#111827}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1;min-width:130px}.day-payment{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:12px;padding:13px;margin-top:10px;color:white}.day-payment.overdue{border-left-color:#991b1b}.day-payment.paid{border-left-color:var(--green)}.day-payment.paid_late{border-left-color:var(--yellow)}.day-payment strong,.day-payment small,.day-payment .price{display:block}.day-payment small{margin-top:5px}.day-payment .price{margin-top:7px;font-weight:700}#message{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:white;color:#111827;border-radius:10px;padding:11px 16px;z-index:999}.receipt-preview{margin-top:14px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0b1422}.receipt-preview img{display:block;width:100%;max-height:58vh;object-fit:contain;background:black}.receipt-preview iframe{display:block;width:100%;height:58vh;border:0;background:white}.receipt-preview-actions{display:flex;gap:8px;padding:10px}.receipt-preview-actions button{flex:1}@media(max-width:700px){.container{padding:calc(15px + env(safe-area-inset-top)) calc(9px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(9px + env(safe-area-inset-left))}header h1{font-size:21px}.stats{grid-template-columns:1fr;gap:7px}.stat{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}.stat span{margin:0}.stat strong{font-size:18px}.calendar-header{padding:13px}.day{min-height:65px;padding:4px}.day-number{margin-bottom:5px}.dots{gap:3px}.dot{width:6px;height:6px}.weekday{font-size:9px}.fab{width:58px;height:58px;right:17px;bottom:17px}.modal-bg{padding:10px}.modal{max-height:calc(100dvh - 30px);padding:17px}}
</style></head><body>
<section id="loginView"><div class="card login-card"><h1>💳 Pagamenti Familiari</h1><p>Accedi per visualizzare scadenze, pagamenti e ricevute.</p><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="primary" onclick="login()">Accedi</button></div></section>
<main id="appView" class="hidden"><div class="container"><header><div><h1>Pagamenti Familiari</h1><small id="userLabel"></small></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button id="notificationButton" class="secondary" onclick="enableNotifications()">🔔 Attiva notifiche</button><button class="secondary" onclick="logout()">Esci</button></div></header><section class="stats"><div class="stat"><span>Da pagare questo mese</span><strong id="toPay">€0,00</strong></div><div class="stat"><span>Pagato questo mese</span><strong id="paidTotal">€0,00</strong></div><div class="stat"><span>Scaduto</span><strong id="overdueTotal">€0,00</strong></div></section><section class="calendar-card"><div class="calendar-header"><h2 id="monthTitle"></h2><div class="nav-buttons"><button onclick="changeMonth(-1)">‹</button><button onclick="goToday()">●</button><button onclick="changeMonth(1)">›</button></div></div><div class="weekdays"><div class="weekday">LUN</div><div class="weekday">MAR</div><div class="weekday">MER</div><div class="weekday">GIO</div><div class="weekday">VEN</div><div class="weekday">SAB</div><div class="weekday">DOM</div></div><div id="calendar" class="calendar"></div></section></div><button class="fab" onclick="openNewPayment()">+</button></main>
<div id="newModal" class="modal-bg hidden"><div class="modal"><div class="modal-top"><h2>Nuova scadenza</h2><button class="close" onclick="closeModal('newModal')">×</button></div><label>Cosa pago</label><input id="newTitle" placeholder="Es. Abbanoa"><label>Importo €</label><input id="newAmount" type="number" min="0" step="0.01"><label>Prima scadenza</label><input id="newDate" type="date"><label>Ricorrenza</label><select id="newRecurrence"><option value="once">Una sola volta</option><option value="monthly" selected>Mensile</option><option value="bimonthly">Ogni 2 mesi</option><option value="quarterly">Trimestrale</option><option value="semiannual">Semestrale</option><option value="annual">Annuale</option></select><label>Numero ricorrenze</label><input id="newCount" type="number" min="1" max="120" value="1"><label>Note (facoltative)</label><textarea id="newNotes"></textarea><button class="primary" onclick="createSeries()">Crea scadenza</button></div></div>
<div id="dayModal" class="modal-bg hidden"><div class="modal"><div class="modal-top"><h2 id="dayTitle"></h2><button class="close" onclick="closeModal('dayModal')">×</button></div><div id="dayPayments"></div></div></div>
<div id="detailModal" class="modal-bg hidden"><div class="modal"><div class="modal-top"><h2 id="detailTitle"></h2><button class="close" onclick="closeModal('detailModal')">×</button></div><div id="detailStatus"></div><div class="detail-row"><span>Scadenza</span><strong id="detailDue"></strong></div><div id="detailInstallmentRow" class="detail-row hidden"><span>Piano</span><strong id="detailInstallment"></strong></div><div class="detail-row"><span>Importo</span><strong id="detailAmount"></strong></div><div class="detail-row"><span>Pagato il</span><strong id="detailPaid">—</strong></div><div id="paymentArea"><label>Data effettiva pagamento</label><input id="paidDate" type="date"><label>Importo pagato</label><input id="paidAmount" type="number" min="0" step="0.01"><label>Ricevuta (PDF o foto)</label><input id="receiptFile" type="file" accept=".pdf,image/jpeg,image/png,image/heic,image/webp"><button class="primary" onclick="markPaid()">Segna come pagato</button></div><div id="receiptArea" class="hidden"><button class="secondary" style="width:100%;margin-top:15px" onclick="openReceipt()">📎 Visualizza ricevuta</button><div id="receiptPreview" class="receipt-preview hidden"></div></div><div class="actions"><button class="secondary" onclick="editPaymentAmount()">Modifica importo</button><button class="danger" id="deletePaymentButton" onclick="deletePayment()">Elimina scadenza</button><button class="danger hidden" id="deletePlanButton" onclick="deletePlan()">Elimina piano</button></div></div></div><div id="message" class="hidden"></div>
<script>
const SUPABASE_URL='https://lhclscufctjhcuzhbjpp.supabase.co';
const SUPABASE_KEY='sb_publishable_BJSdakRk5w9EufXGK1FysA_RANZbBvm';
const VAPID_PUBLIC_KEY='BK83BR3CTsoiMI99hId9ciV9j4s8kxN79f8tET5MkW8IaSRojWwHczL3zJPYypGeCnqZEA5Q5eQsIwuFSc9fc2k';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,householdId=null,payments=[],selectedPayment=null,selectedDay=null,viewDate=new Date();viewDate.setDate(1);
const $=id=>document.getElementById(id);
function money(v){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(v||0))}
function formatDate(d){if(!d)return '—';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function localISODate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function escapeHTML(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function showMessage(t){$('message').textContent=t;$('message').classList.remove('hidden');setTimeout(()=>$('message').classList.add('hidden'),3000)}
function closeModal(id){$(id).classList.add('hidden')}
function installmentLabel(p){const n=Number(p.installment_number),t=Number(p.installment_total);return Number.isInteger(n)&&Number.isInteger(t)&&n>0&&t>1?`Rata ${n} di ${t}`:''}
const statusLabels={unpaid:'DA PAGARE',overdue:'SCADUTA',paid:'PAGATA',paid_late:'PAGATA IN RITARDO'};
function statusHTML(p){return `<span class="status ${p.status}">${statusLabels[p.status]||escapeHTML(p.status)}</span>`}
function urlBase64ToUint8Array(s){const b=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from([...atob(b)].map(c=>c.charCodeAt(0)))}
async function getServiceWorkerRegistration(){if(!('serviceWorker'in navigator))return null;try{const r=await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;return r}catch(e){console.error(e);return null}}
async function updateNotificationButton(){const b=$('notificationButton');if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window)){b.textContent='🔕 Push non supportate';b.disabled=true;return}try{const r=await getServiceWorkerRegistration();if(!r)return;const s=await r.pushManager.getSubscription();if(Notification.permission==='granted'&&s){b.textContent='🔔 Notifiche attive';b.disabled=true}}catch(e){console.error(e)}}
async function enableNotifications(){if(!currentUser||!householdId){alert('Accedi prima di attivare le notifiche.');return}if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window)){alert('Questo dispositivo non supporta le notifiche Web Push.');return}const permission=await Notification.requestPermission();if(permission!=='granted'){alert('Permesso notifiche non concesso.');return}const r=await getServiceWorkerRegistration();if(!r){alert('Impossibile registrare il servizio notifiche.');return}let s=await r.pushManager.getSubscription();if(!s){try{s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)})}catch(e){console.error(e);alert('Impossibile attivare le notifiche push.');return}}const j=s.toJSON();if(!j.endpoint||!j.keys?.p256dh||!j.keys?.auth){alert('Dati della sottoscrizione push incompleti.');return}const {error}=await client.from('push_subscriptions').upsert({user_id:currentUser.id,household_id:householdId,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_agent:navigator.userAgent,updated_at:new Date().toISOString()},{onConflict:'endpoint'});if(error){console.error(error);alert('Notifiche abilitate sul telefono, ma registrazione sul server non riuscita: '+error.message);return}$('notificationButton').textContent='🔔 Notifiche attive';$('notificationButton').disabled=true;showMessage('Notifiche push attivate')}
async function login(){const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){alert('Accesso non riuscito: '+error.message);return}currentUser=data.user;await startApp()}
async function logout(){await client.auth.signOut();location.reload()}
async function checkSession(){const {data}=await client.auth.getSession();if(data.session){currentUser=data.session.user;await startApp()}}
async function startApp(){const {data,error}=await client.from('household_members').select('household_id').eq('user_id',currentUser.id).limit(1).single();if(error||!data){alert('Nucleo familiare non trovato.');return}householdId=data.household_id;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userLabel').textContent=currentUser.email;await loadPayments();await updateNotificationButton()}
async function loadPayments(){const {data,error}=await client.from('payments_calendar').select('*').eq('household_id',householdId).order('due_date');if(error){console.error(error);alert('Errore nel caricamento delle scadenze.');return}payments=data||[];renderCalendar();updateStats();if(selectedDay&&!$('dayModal').classList.contains('hidden'))renderDay()}
function renderCalendar(){const c=$('calendar');c.innerHTML='';const y=viewDate.getFullYear(),m=viewDate.getMonth();$('monthTitle').textContent=new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(viewDate);let offset=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<offset;i++){const b=document.createElement('div');b.className='day empty';c.appendChild(b)}const today=localISODate();for(let day=1;day<=new Date(y,m+1,0).getDate();day++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const cell=document.createElement('button');cell.type='button';cell.className='day'+(date===today?' today':'');const number=document.createElement('div');number.className='day-number';number.textContent=day;cell.appendChild(number);const dots=document.createElement('div');dots.className='dots';const list=payments.filter(p=>p.due_date===date);list.forEach(p=>{const dot=document.createElement('span');dot.className=`dot ${p.status}`;dot.setAttribute('aria-hidden','true');dots.appendChild(dot)});cell.appendChild(dots);cell.setAttribute('aria-label',`${formatDate(date)}, ${list.length} scadenze`);cell.onclick=()=>openDay(date);c.appendChild(cell)}}
function changeMonth(delta){viewDate.setMonth(viewDate.getMonth()+delta);renderCalendar();updateStats()}
function goToday(){viewDate=new Date();viewDate.setDate(1);renderCalendar();updateStats()}
function openDay(date){selectedDay=date;renderDay();$('dayModal').classList.remove('hidden')}
function renderDay(){if(!selectedDay)return;$('dayTitle').textContent=new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'long',year:'numeric'}).format(new Date(selectedDay+'T12:00:00'));const area=$('dayPayments');area.innerHTML='';const list=payments.filter(p=>p.due_date===selectedDay);if(!list.length){area.innerHTML='<p style="color:var(--muted)">Nessuna scadenza per questo giorno.</p>';return}list.forEach(p=>{const b=document.createElement('button');b.type='button';b.className=`day-payment ${p.status}`;const label=installmentLabel(p);b.innerHTML=`<strong>${escapeHTML(p.title)}</strong>${label?`<small>${label}</small>`:''}<span class="price">${money(p.amount_due)}</span>${statusHTML(p)}`;b.onclick=()=>openPayment(p.id);area.appendChild(b)})}
function updateStats(){const y=viewDate.getFullYear(),m=viewDate.getMonth();const list=payments.filter(p=>{const d=new Date(p.due_date+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m});$('toPay').textContent=money(list.filter(p=>p.status==='unpaid').reduce((s,p)=>s+Number(p.amount_due),0));$('paidTotal').textContent=money(list.filter(p=>p.status==='paid'||p.status==='paid_late').reduce((s,p)=>s+Number(p.amount_paid??p.amount_due),0));$('overdueTotal').textContent=money(payments.filter(p=>p.status==='overdue').reduce((s,p)=>s+Number(p.amount_due),0))}
function openNewPayment(){$('newTitle').value='';$('newAmount').value='';$('newDate').value=localISODate();$('newRecurrence').value='monthly';$('newCount').value=1;$('newNotes').value='';$('newModal').classList.remove('hidden')}
async function createSeries(){const title=$('newTitle').value.trim(),amount=Number($('newAmount').value),date=$('newDate').value,recurrence=$('newRecurrence').value,notes=$('newNotes').value.trim();let count=Number($('newCount').value);if(!title||!Number.isFinite(amount)||amount<=0||!date){alert('Compila cosa paghi, importo e scadenza.');return}if(recurrence==='once')count=1;if(!Number.isInteger(count)||count<1||count>120){alert('Numero ricorrenze non valido.');return}const {data:series,error}=await client.from('payment_series').insert({household_id:householdId,title,description:notes||null,default_amount:amount,first_due_date:date,recurrence_type:recurrence,recurrence_count:count,created_by:currentUser.id}).select().single();if(error){console.error(error);alert('Errore: '+error.message);return}if(notes&&series)await client.from('payments').update({notes}).eq('series_id',series.id);closeModal('newModal');showMessage(count===1?'Scadenza creata':`${count} scadenze create`);await loadPayments()}
async function openPayment(id){selectedPayment=payments.find(p=>p.id===id);if(!selectedPayment)return;const p=selectedPayment;$('detailTitle').textContent=p.title;$('detailDue').textContent=formatDate(p.due_date);$('detailAmount').textContent=money(p.amount_due);$('detailPaid').textContent=formatDate(p.paid_at);const label=installmentLabel(p);$('detailInstallment').textContent=label;$('detailInstallmentRow').classList.toggle('hidden',!label);$('detailStatus').innerHTML=statusHTML(p);$('paidDate').value=localISODate();$('paidAmount').value=p.amount_due;$('receiptFile').value='';$('paymentArea').classList.toggle('hidden',p.status==='paid'||p.status==='paid_late');$('deletePaymentButton').textContent=p.series_id&&Number(p.installment_total)>1?'Elimina rata':'Elimina scadenza';$('deletePlanButton').classList.toggle('hidden',!p.series_id||Number(p.installment_total)<=1);const {data,error}=await client.from('payment_receipts').select('*').eq('payment_id',p.id).order('created_at',{ascending:false}).limit(1);if(error)console.error(error);p.receipt=data?.[0]||null;$('receiptArea').classList.toggle('hidden',!p.receipt);$('receiptPreview').innerHTML='';$('receiptPreview').classList.add('hidden');$('dayModal').classList.add('hidden');$('detailModal').classList.remove('hidden')}
async function markPaid(){if(!selectedPayment)return;const paidDate=$('paidDate').value,amount=Number($('paidAmount').value),file=$('receiptFile').files[0];if(!paidDate||!Number.isFinite(amount)||amount<=0){alert('Inserisci data e importo pagato.');return}const {error}=await client.from('payments').update({paid_at:paidDate,amount_paid:amount}).eq('id',selectedPayment.id).eq('household_id',householdId);if(error){alert('Errore: '+error.message);return}if(file&&!await uploadReceipt(selectedPayment,file))alert('Pagamento salvato, ma la ricevuta non è stata caricata.');closeModal('detailModal');showMessage('Pagamento registrato');await loadPayments()}
async function uploadReceipt(payment,file){const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${householdId}/${payment.id}/${Date.now()}_${safeName}`;const {error:uploadError}=await client.storage.from('receipts').upload(path,file,{upsert:false,contentType:file.type});if(uploadError){console.error(uploadError);return false}const {error:dbError}=await client.from('payment_receipts').insert({payment_id:payment.id,household_id:householdId,file_path:path,original_filename:file.name,mime_type:file.type,file_size:file.size,uploaded_by:currentUser.id});if(dbError){console.error(dbError);await client.storage.from('receipts').remove([path]);return false}return true}
async function openReceipt(){if(!selectedPayment?.receipt)return;const preview=$('receiptPreview');preview.classList.remove('hidden');preview.textContent='Caricamento ricevuta…';const {data,error}=await client.storage.from('receipts').createSignedUrl(selectedPayment.receipt.file_path,300);if(error||!data?.signedUrl){console.error(error);preview.textContent='Impossibile generare il link della ricevuta.';return}const mime=selectedPayment.receipt.mime_type||'',url=data.signedUrl;preview.innerHTML='';if(mime.startsWith('image/')){const img=document.createElement('img');img.src=url;img.alt='Ricevuta';preview.appendChild(img)}else if(mime==='application/pdf'){const frame=document.createElement('iframe');frame.src=url;frame.title='Ricevuta PDF';preview.appendChild(frame)}else{const text=document.createElement('div');text.style.padding='16px';text.textContent='Anteprima non disponibile per questo tipo di file.';preview.appendChild(text)}const actions=document.createElement('div');actions.className='receipt-preview-actions';const b=document.createElement('button');b.className='secondary';b.textContent=mime==='application/pdf'?'Apri PDF':'Apri file';b.onclick=()=>openReceiptExternal();actions.appendChild(b);preview.appendChild(actions);selectedPayment.receiptSignedUrl=url}
function openReceiptExternal(){if(!selectedPayment?.receiptSignedUrl)return;const a=document.createElement('a');a.href=selectedPayment.receiptSignedUrl;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()}
async function editPaymentAmount(){if(!selectedPayment)return;const value=prompt('Nuovo importo della singola rata:',selectedPayment.amount_due);if(value===null)return;const amount=Number(value.replace(',','.'));if(!Number.isFinite(amount)||amount<0){alert('Importo non valido.');return}const {error}=await client.from('payments').update({amount_due:amount}).eq('id',selectedPayment.id).eq('household_id',householdId);if(error){alert(error.message);return}closeModal('detailModal');showMessage('Importo aggiornato');await loadPayments()}
async function deletePayment(){if(!selectedPayment)return;const p=selectedPayment;if(!confirm(`Eliminare soltanto la scadenza "${p.title}" del ${formatDate(p.due_date)}?`))return;try{const {error}=await client.from('payments').delete().eq('id',p.id).eq('household_id',householdId);if(error)throw error;closeModal('detailModal');showMessage('Scadenza eliminata');await loadPayments()}catch(e){console.error(e);alert('Cancellazione non completata: '+e.message)}}
async function deletePlan(){if(!selectedPayment?.series_id)return;const seriesId=selectedPayment.series_id;const {data:series,error:seriesError}=await client.from('payment_series').select('id,title').eq('id',seriesId).eq('household_id',householdId).single();if(seriesError||!series){alert('Impossibile verificare il piano.');return}const {data:rows,error:rowsError}=await client.from('payments').select('id,paid_at').eq('series_id',seriesId).eq('household_id',householdId);if(rowsError){alert(rowsError.message);return}const count=rows?.length||0,paid=rows?.filter(r=>r.paid_at).length||0;if(!confirm(`ELIMINA INTERO PIANO\n\n${series.title}\n\nVerranno eliminate ${count} rate, di cui ${paid} già pagate, e i record delle ricevute collegate.\n\nQuesta operazione è irreversibile. Vuoi continuare?`))return;try{const {error}=await client.rpc('delete_payment_plan',{p_series_id:seriesId});if(error)throw error;closeModal('detailModal');showMessage('Piano eliminato');await loadPayments()}catch(e){console.error(e);alert('Cancellazione non completata: '+e.message)}}
checkSession();
</script></body></html>
